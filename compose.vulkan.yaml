name: Eloa

services:
  vulkan:
    extends:
      file: compose.base.yaml
      service: base
    build:
      context: .
      dockerfile: docker/Dockerfile.vulkan
    ports:
      - "8084:8082"
    user: "0:0"
    security_opt:
      - label=disable
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./models:/models:z
    environment:
      TTS_PROVIDER: qwen3-tts
      TTS_MODEL: qwen3-tts-0.6b
      TTS_VOICE: eloa
      TTS_MAX_LOADED_MODELS: "1"
      TTS_LAZY_LOAD: "1"
      TTS_PROVIDER_OPTIONS_FILE: /app/config/providers.json
      TTS_PROVIDER_OPTIONS: '{"qwen3-tts":{"device":"Vulkan0"}}'

networks:
  local:
    external: true

volumes:
  tts-hf-cache:
