name: Eloa

services:
  cuda:
    extends:
      file: compose.base.yaml
      service: base
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    ports:
      - "8085:8082"
    user: "0:0"
    security_opt:
      - label=disable
    gpus: all
    volumes:
      - ./models:/models:z
    environment:
      TTS_PROVIDER: qwen3-tts
      TTS_MODEL: qwen3-tts-0.6b
      TTS_VOICE: eloa
      TTS_MAX_CACHED_MODELS: "1"
      TTS_PROVIDER_OPTIONS_FILE: /app/config/providers.json
      TTS_PROVIDER_OPTIONS: '{"qwen3-tts":{"device":"CUDA0"}}'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: "2gb"

networks:
  local:
    external: true

volumes:
  tts-hf-cache:
